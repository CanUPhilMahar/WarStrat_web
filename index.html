<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WH40k CP Manager</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>⚔ CP Manager <span>Warhammer 40k</span></h1>
        </header>

        <!-- Points selection -->
        <section class="panel points-panel">
            <span class="label">Game Size:</span>
            <div class="btn-group" id="pointsGroup">
                <button class="btn points-btn" data-points="500">500</button>
                <button class="btn points-btn" data-points="1000">1000</button>
                <button class="btn points-btn" data-points="2000">2000</button>
                <button class="btn points-btn" data-points="3000">3000</button>
            </div>
            <span class="info" id="cpInfo">Starting DP: 0</span>
        </section>

        <!-- Faction & Detachment selection -->
        <section class="panel selection-panel">
            <div class="selection-row">
                <div class="selection-item">
                    <label for="factionSelect">Faction:</label>
                    <select id="factionSelect">
                        <option value="">-- Select Faction --</option>
                    </select>
                </div>
                <div class="selection-item">
                    <label for="detachmentList">Detachment:</label>
                    <div id="detachmentList" class="detachment-list">
                        <div class="detachment-empty">Select a faction first</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Detachment Info -->
        <section class="panel detachment-info" id="detachmentInfo">
            <div class="detachment-name" id="detachmentName">—</div>
            <div class="detachment-desc" id="detachmentDesc"></div>
        </section>

        <!-- CP Counter -->
        <section class="cp-panel">
            <div class="cp-display">
                <span class="cp-label">CP</span>
                <span class="cp-value" id="cpValue">0</span>
            </div>
            <div class="cp-actions">
                <button class="btn primary" id="btnAddCp">+ CP</button>
                <label class="checkbox-label">
                    <input type="checkbox" id="chkDoubleCp" />
                    +2 CP per tap
                </label>
                <button class="btn danger" id="btnResetCp">✕ Reset</button>
            </div>
        </section>

        <!-- Stratagems list -->
        <section id="stratagemsContainer">
            <div class="empty-state">Select faction and detachment, then click Load.</div>
        </section>

        <footer>
            <span id="stratCount">0</span> stratagems loaded
        </footer>
    </div>

    <div id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
